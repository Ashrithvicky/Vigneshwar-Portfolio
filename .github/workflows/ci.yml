name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: 
      contents: read
      packages: write

    steps:
      - name: Check Out Code
        uses: actions/checkout@v5

      - name: Set Image Name (GHCR Needs Lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Run Tests (DockerFile Test Stage)
        run: docker build --target test --progress=plain -t portfolio:test .

      - name: Build Runtime Image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke Test The Image
        run: |
          docker run -d --name smoke -p 8081:8080 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8081/ > /dev/null; then
              echo "Smoke Test Passed"
              exit 0
            fi
            sleep 2
          done
          echo "Site Never Responded"
          docker logs smoke
          exit 1 

      - name: Log in to GCHR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"


#------------------------Runs On Instabox-------------------------
  
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, instabox]
    timeout-minutes: 10
    permissions: 
      contents: read
      packages: read
    steps:
      - name: Set Image Name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
  
      - name: Log in to GCHR
        uses: docker/login-action@v3
  
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Pull Image
        run: docker pull "$IMAGE:${{ github.sha }}"
      
      - name: Replace Running Container
        run: |
          docker rm -f portfolio 2>/dev/null ||true 
          docker run -d --name portfolio --restart unless-stopped \
            -p 8081:8080 "$IMAGE:${{ github.sha }}"
      - name: smoke Test On Instabox
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8081/ > /dev/null && { echo "Deploy is live"; exit 0; }
            sleep 2
          done
          echo "Site never responded"; docker logs portfolio; exit 1
  
        
